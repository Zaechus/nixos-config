[dosbox]
memsize=32
vmemsize=8

[cpu]
core=normal
cpu_cycles=7000
cpu_cycles_protected=14000

[autoexec]
mount -u c
mount c ~/dosgames/theme
c:
goto themes

:themes
cls
echo 1 Theme Park
echo 2 Setup
choice /c:12
if errorlevel 2 goto setup
if errorlevel 1 goto theme

:theme
call theme.bat
exit

:setup
cd config
main.exe
cd \
goto themes
