[sdl]
fullscreen=true
vsync=false

[cpu]
cycleup=1000
cycledown=1000

[mouse]
mouse_capture=onstart
mouse_middle_release=off

[autoexec]
@echo off
mount c ~/dosgames
c:
goto launcher

:launcher
cls
echo a
echo b BSTONE
echo d
echo g GAUNTLET
echo h
echo k KEEPER
echo m MK
echo o DOS
echo q QUAKE
echo s SAMURAI
echo t
echo w
choice /c:abdghkmoqstw
if errorlevel 12 goto w
if errorlevel 11 goto t
if errorlevel 10 goto samurai
if errorlevel 9 goto quake
if errorlevel 8 goto dos
if errorlevel 7 goto mk
if errorlevel 6 goto keeper
if errorlevel 5 goto h
if errorlevel 4 goto gauntlet
if errorlevel 3 goto d
if errorlevel 2 goto bstone
if errorlevel 1 goto a

:a
cls
echo p APPLE
echo r ARENA
choice /c:pr
if errorlevel 2 goto arena
if errorlevel 1 goto apple

:d
cls
echo a
echo u DUNE2
choice /c:au
if errorlevel 2 goto dune2
if errorlevel 1 goto da

:h
cls
echo e HEXEN
echo o HOSPITAL
choice /c:eo
if errorlevel 2 goto hospital
if errorlevel 1 goto hexen

:t
cls
echo h THEME
echo i TIE
echo o TOMBRAID
choice /c:hio
if errorlevel 3 goto tombraid
if errorlevel 2 goto tie
if errorlevel 1 goto theme

:w
cls
echo a WARCRAFT
echo c WC
echo o WOLF3D
choice /c:aco
if errorlevel 3 goto wolf3ds
if errorlevel 2 goto wc
if errorlevel 1 goto warcraft

:da
cls
echo g DAGGER
echo r DARK
choice /c:gr
if errorlevel 2 goto dark
if errorlevel 1 goto dagger

:apple
cpu_cycles 256
cd apple
apple
exit

:arena
config -r -noprimaryconf -conf default.conf -conf arena.conf

:bstone
cpu_cycles max
cpu_cycles_protected max
cd bstone
bstone
exit

:dagger
config -r -noprimaryconf -conf default.conf -conf dagger.conf

:dark
mount -u c
mount c ~/dosgames/dark
c:
dark
exit

:dune2
cpu_cycles 15000
cd dune2
dune2
exit

:hexen
mount -u c
mount c ~/dosgames/hexen
imgmount d ~/dosgames/hexen/game.ins -t iso
c:
hexen
exit

:hospital
mount -u c
mount c ~/dosgames/hospital
c:
hospital
exit

:gauntlet
config -r -noprimaryconf -conf default.conf -conf gauntlet.conf

:keeper
config -r -noprimaryconf -conf default.conf -conf keeper.conf

:mk
cls
echo 1 MK1
echo 2 MK2
echo 3 MK3
choice /c:123
if errorlevel 3 goto mk3
if errorlevel 2 goto mk2
if errorlevel 1 goto mk1

:mk1
config -r -noprimaryconf -conf default.conf -conf mk1.conf

:mk2
config -r -noprimaryconf -conf default.conf -conf mk2.conf

:mk3
config -r -noprimaryconf -conf default.conf -conf mk3.conf

:quake
config -r -noprimaryconf -conf default.conf -conf quake.conf

:samurai
cd samurai
OLD.COM /NJ /GV /AA
exit

:theme
config -r -noprimaryconf -conf default.conf -conf theme.conf

:tie
config -r -noprimaryconf -conf default.conf -conf tie.conf

:tombraid
mount -u c
mount c ~/dosgames/tombraid
imgmount d ~/dosgames/tombraid/game.dat -t iso -fs iso
c:
cd TOMBRAID
tombs.exe
exit

:warcraft
cpu_cycles 30000
cpu_cycles_protected auto
cd warcraft
imgmount d WAR1.CUE -t iso
cls
echo HINT: Use SB16 for music
echo/
echo 1 setup
echo 2 singleplayer
echo 3 multiplayer
choice /c:123r
if errorlevel 4 goto war
if errorlevel 3 goto dos
if errorlevel 2 goto war
if errorlevel 1 goto warcraft_setup

:warcraft_setup
setup
goto warcraft

:war
war
exit

:wc
cls
echo 1 WC1
echo 2 WC2
choice /c:12
if errorlevel 2 goto wc2
if errorlevel 1 goto wc1

:wc1
core simple
cpu_cycles 4000
cputype 386
cd wc
cls
echo 1 Wing Commander + The Secret Missions
echo 2 The Secret Missions 2: Crusade
choice /c:12
if errorlevel 2 goto wc1sm2
if errorlevel 1 goto wc1wc

:wc1wc
loadfix -1 wc
exit

:wc1sm2
loadfix -1 sm2
exit

:wc2
cpu_cycles 8000
cd wc2
cls
echo 1 Wing Commander II: Vengeance of the Kilrathi
echo 2 Wing Commander II: Special Operations 1
echo 3 Wing Commander II: Special Operations 2
choice /c:123
if errorlevel 3 goto wc2so2
if errorlevel 2 goto wc2so1
if errorlevel 1 goto wc2wc2

:wc2wc2
loadfix -32 wc2
exit

:wc2so1
loadfix -32 so1
exit

:wc2so2
loadfix -32 so2
exit

:wolf3ds
cpu_cycles 15000
cd wolf3d
cls
echo 1 Wolfenstein 3D
echo 2 Spear of Destiny
choice /c:12
if errorlevel 2 goto spear
if errorlevel 1 goto wolf3d

:wolf3d
wolf3d
exit

:spear
cd m1
spear
exit

:dos
ipx true
cls
echo IPXNET STARTSERVER port
echo IPXNET CONNECT address port
