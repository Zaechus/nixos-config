[sdl]
mapperfile=~/.config/dosbox/tie.map

[joystick]
joysticktype=2axis
timed=false

[cpu]
cpu_cycles=max
cpu_cycles_protected=max

[autoexec]
echo 1 STAR WARS Tie Fighter
echo 2 STAR WARS Tie Fighter Special Edition
choice /c:12
if errorlevel 2 goto tie1995
if errorlevel 1 goto tie1994

:tie1994
cd tie
tie
exit

:tie1995
mount -u c
mount c ~/dosgames/tiecd
imgmount d ~/dosgames/tiecd/game.ins -t iso
c:
tie
exit
