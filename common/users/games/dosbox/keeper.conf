[dosbox]
memsize=30
vmemsize=8

[cpu]
# cputype=486
# cpu_cycles=80000

# cpu_cycles=160000

# cpu_cycles_protected=auto
cycleup=10000
cycledown=10000

[autoexec]
mount -u c
mount c ~/dosgames/keeper
imgmount d ~/dosgames/keeper/game.ins -t iso -fs iso
c:
goto keepers

:keepers
cls
echo 1 Dungeon Keeper
echo 2 Deeper Dungeons
echo 3 Setup
choice /c:123
if errorlevel 3 goto keeper_setup
if errorlevel 2 goto deeper
if errorlevel 1 goto keeper

:keeper
keeper.exe
exit

:deeper
deeper.exe
exit

:keeper_setup
mkdir C:\SAVE
cd sound
setsound.exe
cd ..
copy d:\keeper\data\english\dd1text.dat c:\data\dd1text.dat
copy d:\keeper\data\english\text.dat c:\data\text.dat
copy d:\keeper\sound\atlas\english\*.* c:\sound\atlas\*.*
copy d:\keeper\sound\speech\english\speech.dat c:\sound\speech.dat
goto keepers
