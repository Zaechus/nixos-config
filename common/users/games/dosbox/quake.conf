[dosbox]
memsize=32
vmemsize=8

[cpu]
core=dynamic
cpu_cycles=max
cpu_cycles_protected=max

[autoexec]
cd quake
goto quakes

:quakes
cls
echo 1 Quake
echo 2 Quake: Scourge of Armagon
echo 3 Quake: Dissolution of Eternity
choice /c:123
if errorlevel 3 goto quake_rogue
if errorlevel 2 goto quake_hipnotic
if errorlevel 1 goto quake

:quake
imgmount d game.cue -t iso
cls
echo 1 singleplayer
echo 2 multiplayer
echo 3 start server on port 26000
choice /c:123
if errorlevel 3 goto quake_server
if errorlevel 2 goto dos
if errorlevel 1 goto quake_single

:quake_single
quake
exit

:quake_server
ipx true
ipxnet startserver 26000
quake -listen 16
exit

:quake_hipnotic
imgmount d gamea.cue -t iso
quake -game hipnotic
exit

:quake_rogue
imgmount d gamed.cue -t iso
quake -game rogue
exit
